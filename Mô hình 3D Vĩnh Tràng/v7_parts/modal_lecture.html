  <!-- Modal: Giảng đường Phật pháp (chuẩn thiết kế giang-duong-phat-phap-de-xuat-01.png) -->
  <div class="modal-overlay" id="lecture-modal">
    <div class="modal" style="max-width:480px; background:#FCF9F2; border:2px solid #D8C69A; border-radius:28px; padding:24px 22px 20px; box-shadow:0 16px 48px rgba(0,0,0,0.38); text-align:center;">
      <button class="modal-close" onclick="closeModal('lecture-modal')">✕</button>
      
      <!-- Lotus Icon -->
      <svg width="46" height="34" viewBox="0 0 48 36" fill="none" style="margin:0 auto 4px; display:block;">
        <path d="M24 4 C24 14 18 24 10 26 C16 27 22 25 24 21 C26 25 32 27 38 26 C30 24 24 14 24 4 Z" fill="#E86C8D" />
        <path d="M24 14 C20 18 17 25 24 30 C31 25 28 18 24 14 Z" fill="#FFB7C5" />
        <path d="M12 28 C18 31 30 31 36 28" stroke="#3A754F" stroke-width="2.5" stroke-linecap="round" />
      </svg>
      
      <div style="font-size:24px; font-weight:800; color:#1C5A34; letter-spacing:0.3px; margin-top:2px;">Giảng đường Phật pháp</div>
      <div style="font-size:14px; color:#6B4226; margin-top:3px; margin-bottom:18px;">Cùng nghe giảng, học từng bài</div>

      <!-- 2 Feature cards -->
      <div style="display:flex; gap:12px; margin-bottom:14px;">
        <div style="flex:1; background:#FFF4DF; border:1.5px solid #EADBBE; border-radius:18px; padding:12px 10px; display:flex; align-items:center; gap:10px; text-align:left;">
          <div style="font-size:24px; flex:none;">👥</div>
          <div style="font-size:13.5px; font-weight:700; color:#4A3222; line-height:1.3;">Nghe giảng cùng nhau</div>
        </div>
        <div style="flex:1; background:#FFF4DF; border:1.5px solid #EADBBE; border-radius:18px; padding:12px 10px; display:flex; align-items:center; gap:10px; text-align:left;">
          <div style="font-size:24px; flex:none;">📱</div>
          <div style="font-size:13.5px; font-weight:700; color:#4A3222; line-height:1.3;">Bài học trên điện thoại</div>
        </div>
      </div>

      <!-- Course highlight -->
      <div style="background:#FFF0D0; border:1.5px solid #DFC488; border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:18px; text-align:left; cursor:pointer;" onclick="closeModal('lecture-modal'); if (window.openLessons) window.openLessons();">
        <div style="font-size:26px; flex:none;">📖</div>
        <div>
          <div style="font-size:14.5px; font-weight:800; color:#1C5A34;">Bài đầu tiên: Đạo Phật là gì?</div>
          <div style="font-size:12px; color:#7A5538; margin-top:2px;">4 lộ trình học tập từ căn bản đến chuyên sâu</div>
        </div>
      </div>

      <div style="font-size:14px; font-weight:700; color:#4A3222; margin-bottom:10px;">Cần gói học để tham gia</div>

      <button class="btn-submit" id="btn-see-courses" style="background:#1C5A34; font-size:16px; padding:13px 0; border-radius:999px; margin-bottom:10px;" onclick="closeModal('lecture-modal'); if (window.openLessons) window.openLessons();">
        🪷 Xem gói học
      </button>

      <button style="width:100%; background:#EFE3C4; border:none; border-radius:999px; color:#4A3222; font-family:inherit; font-size:13.5px; font-weight:700; padding:10px 0; cursor:pointer;" onclick="closeModal('lecture-modal'); if (window.openLessons) window.openLessons();">
        Tôi đã có gói học
      </button>
    </div>
  </div>
